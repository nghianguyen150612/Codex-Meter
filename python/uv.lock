version = 1
revision = 3
requires-python = ">=3.11"

[[package]]
name = "attrs"
version = "26.1.0"
sdist = { url = "https://files.pythonhosted.org/packages/source/a/attrs/attrs-26.1.0.tar.gz" }
source = { registry = "https://pypi.org/simple" }

[[package]]
name = "codex-meter-analytics"
version = "0.0.0"
source = { virtual = "." }

[package.dev-dependencies]
dev = [
    { name = "jsonschema" },
    { name = "pytest" },
    { name = "referencing" },
    { name = "ruff" },
]

[package.metadata]
requires-dev = { dev = [
    { name = "jsonschema", specifier = ">=4.23,<5" },
    { name = "pytest", specifier = ">=8.3,<10" },
    { name = "referencing", specifier = ">=0.36,<1" },
    { name = "ruff", specifier = ">=0.11,<1" },
] }

