[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "codex-meter-analytics"
version = "0.0.0"
description = "Internal analytics package for Codex Meter"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = []

[dependency-groups]
dev = [
  "jsonschema>=4.23,<5",
  "pytest>=8.3,<10",
  "referencing>=0.36,<1",
  "ruff>=0.11,<1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.uv]
package = false

[tool.hatch.build.targets.wheel]
packages = ["codex_meter"]
exclude = [
  "**/__pycache__/**",
  "**/*.py[cod]",
  "**/*.sqlite",
  "**/*.sqlite-*",
  "**/*.db",
  "**/*.db-*",
  "**/*.jsonl",
  "**/.env",
  "**/.env.*",
  "**/credentials*",
  "**/secrets*",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
