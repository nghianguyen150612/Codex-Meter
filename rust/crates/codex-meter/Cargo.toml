[package]
name = "codex-meter"
version = "0.1.0"
edition = "2021"
publish = false
description = "Codex Meter current-capacity estimate CLI"
license = "MIT"

[dependencies]
libc = "0.2"
ratatui = { version = "0.29.0", default-features = false, features = ["crossterm"] }
crossterm = "0.28.1"
rusqlite = { version = "0.40.2", default-features = false, features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
time = { version = "0.3", features = ["formatting", "parsing"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
    "Win32_System_JobObjects",
    "Win32_System_SystemServices",
    "Win32_System_Threading",
] }

[target.'cfg(windows)'.dev-dependencies]
portable-pty = "0.9.0"

[features]
default = []
# Distribution builds must resolve the installed analytics wheel and must not
# embed the build machine's source-checkout path in the executable.
release-artifact = []

[lib]
name = "codex_meter"
path = "src/lib.rs"

[[bin]]
name = "codex-meter"
path = "src/main.rs"
